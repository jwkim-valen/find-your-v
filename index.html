<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>FIND YOUR V</title>
<style>
/* Layout: 단일 컬럼(최대 640px) 중앙 정렬. 상단 브랜드 바 → 진행률 → 질문 1개 → 세로 카드 4개. 결과는 탭 + 카드 스택. */
:root{
  --bg:#FFFFFF; --bg-soft:#F4F6F9; --fg:#0F1420; --muted:#5B6473;
  --line:#E3E7ED; --line-strong:#B9C0CC; --brand:#255CC8; --brand-text:#255CC8; --on-brand:#FFFFFF; --tint:#EEF3FC;
  /* 영문은 Helvetica, 한글은 Pretendard (Helvetica에 한글 글리프가 없어 자동으로 Pretendard가 쓰임) */
  --font-body:"Helvetica Neue",Helvetica,Arial,"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:var(--font-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F15; --bg-soft:#151A23; --fg:#EEF1F6; --muted:#9AA3B2;
    --line:#242B37; --line-strong:#3E4757; --brand-text:#7AA2F0; --tint:#14213A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F15; --bg-soft:#151A23; --fg:#EEF1F6; --muted:#9AA3B2;
  --line:#242B37; --line-strong:#3E4757; --brand-text:#7AA2F0; --tint:#14213A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;letter-spacing:-.01em;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
button,input,textarea{letter-spacing:inherit}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 72px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;font-family:var(--font-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--fg);font-weight:700}
.screen{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

/* intro */
.intro{padding-top:36px}
.kicker{font-family:var(--font-display);font-size:12px;letter-spacing:.18em;color:var(--brand-text);font-weight:700;margin:0 0 14px}
.h-title{font-family:var(--font-display);font-weight:700;font-size:clamp(46px,13vw,76px);line-height:.98;letter-spacing:-.04em;margin:0}
.h-title span{color:var(--brand-text)}
.sub{font-size:clamp(18px,4.6vw,22px);font-weight:500;margin:20px 0 40px;text-wrap:balance}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:34px 0 8px}
.strip i{display:block;height:44px;border-radius:6px;background:var(--c)}
.strip i.w{border:1.5px solid var(--line-strong)}
.cap{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0 0 30px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line);margin-bottom:22px}
.facts div{padding:16px 0;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts strong{display:block;font-family:var(--font-display);font-size:24px;line-height:1.2}
.facts span{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0 0 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);font-weight:700;font-size:16px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.nm{margin:0 0 14px}
.nm label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.nm input{width:100%;min-height:52px;padding:0 16px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.nm input:focus{outline:2px solid var(--brand-text);outline-offset:1px;border-color:var(--brand)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;font-weight:500}
.ghost{background:none;border:0;color:var(--muted);padding:8px 4px;min-height:44px;font-size:14px}
.ghost:hover{color:var(--fg)}

/* quiz */
.prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-bottom:34px}
.prog .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s ease}
.prog .n{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.prog .n em{font-style:normal;color:var(--muted);font-weight:500}
.qno{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--brand-text);margin:0 0 10px}
.q{font-size:clamp(24px,6vw,30px);line-height:1.4;font-weight:700;margin:0 0 32px;text-wrap:balance;letter-spacing:-.02em}
.qhint{font-size:14px;color:var(--muted);margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;text-align:left;padding:18px 18px;min-height:68px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--line-strong);background:var(--bg-soft)}
.opt:active{transform:scale(.995)}
.opt .k{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--muted);margin-top:-1px}
.opt .t{font-size:16.5px;line-height:1.5;padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--tint)}
.opt[aria-pressed="true"] .k{background:var(--brand);border-color:var(--brand);color:#fff}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* loading */
.load{min-height:62vh;display:grid;place-items:center}
.ld{width:100%;max-width:340px;text-align:center}
.ring{width:44px;height:44px;margin:0 auto 28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lmw{position:relative;height:64px}
.lm{position:absolute;inset:0;margin:0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(15px,4.6vw,19px);font-weight:700;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .9s ease;pointer-events:none}
.lm .t{position:relative;display:inline-block}
.lm.on{opacity:1}
.dots{position:absolute;left:100%;top:0;margin-left:2px;white-space:nowrap}
.dots i{font-style:normal;animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.dots i{animation:none}.lm{transition:none}}

/* result */
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:.16em;color:var(--brand-text);font-weight:700;margin:8px 0 10px}
.r-title{font-size:clamp(24px,6vw,30px);line-height:1.4;letter-spacing:-.02em;font-weight:700;margin:0;text-wrap:balance}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-soft);border-radius:12px;margin:24px 0 32px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.hero{border-radius:20px;overflow:hidden;border:1.5px solid var(--line);margin:4px 0 10px}
.hero-main{background:var(--c);color:var(--ink);padding:24px 24px 28px}
.hero-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-display);font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.85;margin-bottom:34px}
.hero-nm{font-size:17px;font-weight:500;margin:0 0 6px;line-height:1.4}
.hero-tn{font-family:var(--font-display);font-weight:700;font-size:clamp(44px,14vw,68px);line-height:1;letter-spacing:-.02em;margin:0}
.hero-cn{font-family:var(--font-display);font-size:14px;letter-spacing:.12em;margin:12px 0 0}
.hero-tt{font-size:17px;font-weight:700;margin:6px 0 0;line-height:1.4}
.hero-lb{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.75;margin:28px 0 4px}
.hero-ds{font-size:14px;line-height:1.6;margin:26px 0 0;opacity:.92}
.hero-sub{background:var(--c2);color:var(--ink2);padding:20px 24px 24px;display:block}
.hero-sub small{display:block;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.75}
.hero-sub small.pl{margin-top:20px}
.hero-sub b{display:block;font-family:var(--font-display);font-size:22px;letter-spacing:-.02em;margin-top:6px}
.hero-sub em{display:block;font-style:normal;font-family:var(--font-display);font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.9}
.hero-sub span{display:block;font-size:15px;font-weight:700;margin-top:4px}
.hero.sepw .hero-sub{border-top:1.5px solid var(--line-strong)}
.shot{font-size:13px;color:var(--muted);margin:0}
.share{margin-top:30px}
.flip{perspective:1400px;width:100%;max-width:440px;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.flip:focus,.flip:focus-visible{outline:none}
.flip{position:relative}
.flip-in{position:relative;width:100%;aspect-ratio:1080/1500;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.flip{container-type:inline-size}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{border-radius:0;overflow:visible}
.face.back{border-radius:22px;border-radius:5.2cqw;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--bg-soft);display:grid;place-items:center;text-align:center;padding:24px}
.face.back b{display:block;font-size:28px;font-weight:700;margin-bottom:8px}
.face.back span{font-size:13.5px;color:var(--muted);line-height:1.6}
.cardimg{display:block;width:100%;height:100%;image-rendering:auto}
#sharecard{margin-top:16px}
.ov{position:fixed;inset:0;overflow-x:hidden;z-index:50;background:rgba(6,8,12,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:in .25s ease both}
.ov.reveal{animation:ovIn .7s ease both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.ov.reveal .ov-in>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.ov.reveal .ov-in>*:nth-child(2){animation-delay:.08s}
.ov.reveal .ov-in>*:nth-child(3){animation-delay:.16s}
.ov.reveal .ov-in>*:nth-child(4){animation-delay:.28s}
.ov.reveal .ov-in>*:nth-child(5){animation-delay:.4s}
.ov.reveal .ov-in>*:nth-child(6){animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ov.reveal,.ov.reveal .ov-in>*{animation:none}}
.ov-in{margin:auto;width:100%;max-width:440px;color:#fff;text-align:center}
.ov .kk{font-family:var(--font-display);font-size:11px;letter-spacing:.18em;font-weight:700;color:rgba(255,255,255,.7);margin:0}
.ov h2{font-size:clamp(24px,6vw,30px);line-height:1.4;letter-spacing:-.02em;font-weight:700;margin:10px 0 8px;text-wrap:balance}
.ov-in>*:not(.flip){position:relative;z-index:2}
.ov .ds{margin:0 0 30px;color:rgba(255,255,255,.85);font-size:15px;line-height:1.6}
.ov .ds p{margin:0 0 6px;text-wrap:balance}
.ov .ds .cl{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,.65)}
.ov .flip{max-width:min(440px,calc((100vh - 320px)*.72));min-width:240px}
.hw{position:relative;margin:26px 0 22px}
.hw .shot{margin:0!important}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:100%;padding:11px 18px;border-radius:99px;background:#fff;color:#0F1420;font-size:14px;font-weight:500;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s ease;z-index:60}
.toast.show{opacity:1;transition:opacity .25s ease}
.ov .btn.ic{min-width:52px;width:52px;padding:0}
@media (prefers-reduced-motion:reduce){.toast,.toast.show{transition:none}}
.ov .sn{margin:0 0 20px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;line-height:1.6;text-wrap:balance}
.ov .sn .fb-text{margin-top:10px;min-height:64px;background:#fff;color:#0F1420}
.ovb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ov .fallback p{color:rgba(255,255,255,.75)}
.sv{text-align:center;padding-top:8px}
.sv .kk{font-family:var(--font-display);font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--muted);margin:0}
.sv h2{font-size:clamp(24px,6vw,30px);line-height:1.4;letter-spacing:-.02em;font-weight:700;margin:10px 0 8px;text-wrap:balance}
.sv .ds{margin:0 0 24px;color:var(--muted);font-size:15px}
.sv .ds p{margin:0}
.sv .shot{text-align:center;margin:16px 0 26px}
.sv .btn{max-width:440px}
.load-note{color:var(--muted);padding:80px 0}
.ov .shot{color:rgba(255,255,255,.7);margin:26px 0 22px;text-align:center}
.ov .btn{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;min-width:140px}
.ov .btn:hover{background:rgba(255,255,255,.12)}
.ov .hero{border-color:rgba(255,255,255,.3);text-align:left;color:#fff}
.rank{border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin:0 0 30px}
.rank div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:15px}
.rank div+div{border-top:1px solid var(--line)}
.rank b{font-family:var(--font-display)}
.rank span{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.sec-h{font-family:var(--font-display);font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:34px 0 14px;text-transform:uppercase}
.sec-p{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.tcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:24px;background:var(--bg)}
.sw{background:var(--c);color:var(--ink);padding:26px 22px 22px}
.sw.w{border-bottom:1.5px solid var(--line-strong)}
.sw .tag{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.8;margin:0 0 32px}
.sw .tn{font-family:var(--font-display);font-weight:700;font-size:clamp(36px,10.5vw,52px);line-height:1;letter-spacing:-.02em;margin:0}
.sw .cn{font-family:var(--font-display);font-size:14px;letter-spacing:.12em;margin:8px 0 18px;opacity:.9}
.sw .tt{font-size:19px;font-weight:700;margin:0;line-height:1.4}
.sw .sc{display:inline-block;margin-top:16px;font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid currentColor;opacity:.9;font-variant-numeric:tabular-nums}
.tbody{padding:22px}
.tbody p{margin:0 0 6px}
.tbody h4{margin:22px 0 6px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tbody h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:7px 12px;border-radius:99px;border:1px solid var(--line)}
.chips span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chips.cw span::before{border:1px solid var(--line-strong)}
.pick{display:flex;flex-direction:column;gap:10px}
.pk{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-height:68px}
.pk:hover{background:var(--bg-soft)}
.pk .dot{width:36px;height:36px;border-radius:10px;background:var(--c)}
.pk .dot.w{border:1.5px solid var(--line-strong)}
.pk b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.3}
.pk small{color:var(--muted);font-size:13.5px;line-height:1.4;display:block}
.pk[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 1px var(--brand)}
.final{margin-top:18px}
.final .sw .tn{font-size:clamp(28px,8.4vw,42px)}
.final .sw .big{font-size:18px;font-weight:700;margin:20px 0 0}
.final .act{padding:18px 22px;display:flex;gap:10px;flex-wrap:wrap}
.fb-text{width:100%;margin-top:12px;min-height:110px;padding:12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px;resize:vertical}
.fallback{margin:0 22px 18px}
.fallback p{font-size:13px;color:var(--muted);margin:0}

/* explain tab */
.ex{border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.ex .qn{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0 0 4px}
.ex .qq{font-weight:700;margin:0 0 14px;line-height:1.45}
.ex dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:10px 12px;font-size:15px}
.ex dt{color:var(--muted);font-size:13px;padding-top:2px}
.ex dd{margin:0;min-width:0}
.vt{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700}
.vt::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.vt.w::before{border:1px solid var(--line-strong)}

/* feedback + debug */
.panel{border-top:1px solid var(--line);margin-top:44px;padding-top:30px}
.panel h3{font-size:20px;margin:0 0 4px}
.panel .lead{font-size:14px;color:var(--muted);margin:0 0 20px}
.fq{margin:0 0 22px}
.fq p{margin:0 0 10px;font-weight:500;font-size:15px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--font-display);font-weight:700;font-size:17px}
.scale button:hover{background:var(--bg-soft)}
.scale button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
details.dbg{margin-top:36px;border:1px dashed var(--line-strong);border-radius:12px;padding:0 16px}
details.dbg summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.tw{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:420px}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
td .vt{font-size:13.5px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);margin:0 0 16px;word-break:break-all}
</style>

</head>

/* ───────── 점수 계산 ───────── */
function compute(){
  var counts = {}; TYPES.forEach(function(t){counts[t.k]=0;});
  state.answers.forEach(function(a,qi){ counts[QS[qi].o[a].v]++; });
  var first = {}; state.answers.forEach(function(a,qi){ var k=QS[qi].o[a].v; if(first[k]===undefined) first[k]=qi; });
  var rows = TYPES.map(function(t){ return {t:t,n:counts[t.k],d:APPEAR[t.k],f:first[t.k]===undefined?99:first[t.k]}; });
  // 분수 교차곱으로 비교 (부동소수점 오차 없음). 동률은 표시 순서만 고정하고 우열은 두지 않음.
  rows.sort(function(a,b){ var x=a.n*b.d, y=b.n*a.d; if(x!==y) return y-x;            // 1순위: 선택 비율
    if(a.n!==b.n) return b.n-a.n;     // 동점: 실제 선택 횟수가 많은 쪽
    if(a.f!==b.f) return a.f-b.f;     // 그래도 같으면 먼저 선택한 쪽
    return a.t.order-b.t.order; });
  var groups = [];
  rows.forEach(function(r,i){
    var g = groups[groups.length-1];
    if(g && g.rows[0].n*r.d === r.n*g.rows[0].d){ g.rows.push(r); }
    else { groups.push({rank:i+1, rows:[r]}); }
  });
  return {rows:rows, groups:groups};
}
function rankLabel(g){ return g.rows.length>1 ? "공동 "+g.rank+"위" : g.rank+"위"; }

/* 결과 카드를 캔버스로 그려 PNG 데이터 주소로 돌려줍니다 */
function fitFont(x,text,maxW,start,min,weight,family){
  var size=start;
  while(size>min){ x.font=weight+" "+size+"px "+family; if(x.measureText(text).width<=maxW) break; size-=2; }
  x.font=weight+" "+size+"px "+family;
}
function rr(x,X,Y,w,h,r){
  x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath();
}
function wrapText(x,text,maxW){
  var words=text.split(" "), lines=[], cur="";
  words.forEach(function(w){
    var t=cur?cur+" "+w:w;
    if(x.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}
function makeCard(m,sb,name,inPage){

    // 어떤 모니터에서도 축소 비율이 깔끔하게 떨어지도록 합니다 (계단 현상 방지)
    var W=1080,H=1500,split=1000,pad=84,inner=W-pad*2,R=56;

    var pr=Math.max(2,Math.ceil(window.devicePixelRatio||1));
    var PX=Math.max(600,Math.min(1440,Math.round(cssW*pr)));
    var c=document.createElement("canvas"); c.width=PX; c.height=Math.round(PX*H/W);
    var x=c.getContext("2d"); x.scale(PX/W,PX/W);
    var D='"Helvetica Neue",Helvetica,Arial,"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif', B=D;
    x.save(); rr(x,0,0,W,H,R); x.clip();            // 모서리 바깥은 투명하게 유지
    x.fillStyle=m.hex; x.fillRect(0,0,W,split);
    x.fillStyle=sb.hex; x.fillRect(0,split,W,H-split);
    if(m.white||sb.white){ x.strokeStyle="#B9C0CC"; x.lineWidth=4; x.beginPath(); x.moveTo(0,split); x.lineTo(W,split); x.stroke(); }
    x.textBaseline="alphabetic"; x.textAlign="left";
    var LS=function(px){ if("letterSpacing" in x) x.letterSpacing=px+"px"; };
    var label=function(t,X,Y,al){ LS(3); x.font="700 26px "+D; x.globalAlpha=al; x.fillText(t,X,Y); x.globalAlpha=1; };
    var rule=function(Y,col){ x.save(); x.globalAlpha=.28; x.strokeStyle=col; x.lineWidth=2; x.beginPath(); x.moveTo(pad,Y); x.lineTo(W-pad,Y); x.stroke(); x.restore(); };
    // ── 메인 컬러 영역: 헤더 / 이름 / MAIN / 성향 ──
    x.fillStyle=m.ink;
    label("THE V AWARDS 2026",pad,124,.85);

    rule(168,m.ink);

    label("MAIN",pad,412,.75);

    label("PERSONALITY",pad,split-150,.75);
    LS(-.6); fitFont(x,m.title,inner,48,28,"700",B); x.fillText(m.title,pad,split-84);

    x.fillStyle=sb.ink;
    label("SUB",pad,split+100,.75);
    LS(-3); fitFont(x,sb.k,inner,64,40,"700",D); x.fillText(sb.k,pad,split+188);
    LS(4); x.font="700 32px "+D; x.fillText(sb.c,pad,split+246);
    rule(split+292,sb.ink);
    label("PERSONALITY",pad,split+346,.75);
    LS(-.6); fitFont(x,sb.title,inner,40,26,"700",B); x.fillText(sb.title,pad,split+410);
    LS(0); x.restore();
    if(m.white||sb.white){ x.strokeStyle="#B9C0CC"; x.lineWidth=4; rr(x,2,2,W-4,H-4,R-2); x.stroke(); }

  });

/* ───────── 링크 공유: 결과를 주소 뒤 #v-메인-서브-이름(16진수) 로 담습니다. 서버 저장 없음 ───────── */
function toHex(str){ var b=new TextEncoder().encode(str), o=""; b.forEach(function(x){ o+=("0"+x.toString(16)).slice(-2); }); return o; }
function fromHex(h){
  if(h.length%2) return null;
  var a=new Uint8Array(h.length/2);
  for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(a); }catch(e){ return null; }
}
function shareHash(m,sb,name){ return "v-"+m.k.toLowerCase()+"-"+sb.k.toLowerCase()+"-"+toHex(name); }
function parseShare(){
  var h=(location.hash||"").replace(/^#/,"");
  var r=/^v-([a-z]+)-([a-z]+)-([0-9a-f]{2,200})$/.exec(h);
  if(!r) return null;
  var mk=r[1].toUpperCase(), sk=r[2].toUpperCase();
  if(!T[mk]||!T[sk]||mk===sk) return null;
  var nm=fromHex(r[3]); if(nm===null) return null;
  nm=nm.replace(/[\u0000-\u001f\u007f]/g,"").trim();
  if(!nm||Array.from(nm).length>12) return null;
  return {m:T[mk],sb:T[sk],name:nm};
}
function baseUrl(){
  var u=location.href.split("#")[0];
  try{ var r=document.referrer; if(r&&/^https:\/\/claude\.ai\/(code\/)?artifact\//.test(r)) u=r.split("#")[0]; }catch(e){}
  return u;
}
var shareInfo=null;
function renderShared(){
  var m=shareInfo.m, sb=shareInfo.sb;
  app.innerHTML='<section class="screen sv"><p class="load-note">카드를 불러오는 중이에요</p></section>';
  makeCard(m,sb,state.name,true).then(function(u){return u;},function(){return null;}).then(function(url){
    app.innerHTML='<section class="screen sv"><p class="kk">THE V AWARDS 2026</p><h2>'+KW[m.k]+' '+esc(state.name)+'님</h2><div class="ds"><p>'+m.trait+'</p></div>'+
      cardBlock(m,sb,url)+'<button class="btn primary block" id="me">나도 테스트하기</button></section>';
    bindFlip(document.getElementById("flip"));
    document.getElementById("me").onclick=function(){
      shareInfo=null; state.name=""; state.shot=undefined;
      try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ try{ location.hash=""; }catch(e2){} }
      go("intro");
    };
  });
}

function showCard(m,sb,url,closeLabel,restoreEl,reveal,link){
  var ov=document.createElement("div"); ov.className="ov"+(reveal?" reveal":""); ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.innerHTML='<div class="ov-in"><p class="kk">THE V AWARDS 2026</p>'+
    '<h2>'+KW[m.k]+' '+esc(state.name)+'님</h2>'+
    '<div class="ds"><p>'+m.trait+'</p></div>'+
    cardBlock(m,sb,url)+
    (link?'<div class="sn" id="ovn" hidden></div>':'')+
    '<div class="ovb">'+(link?'<button class="btn ic" id="ovl" aria-label="링크 복사" title="링크 복사"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>':'')+'<button class="btn" id="ovx">'+closeLabel+'</button></div></div>';
  if(link){
    // 알림은 "카드를 누르면 뒤집혀요" 안내 줄 위에 겹쳐 잠깐 보였다가 사라집니다 (버튼을 가리지 않음)
    var hint=ov.querySelector(".shot");
    if(hint){
      var hw=document.createElement("div"); hw.className="hw";
      hint.parentNode.insertBefore(hw,hint); hw.appendChild(hint);
      var tEl=document.createElement("div"); tEl.className="toast"; tEl.id="ovt"; tEl.setAttribute("role","status"); tEl.setAttribute("aria-live","polite");
      hw.appendChild(tEl);
    }
  }
  document.body.appendChild(ov);
  var prevOverflow=document.body.style.overflow; document.body.style.overflow="hidden";
  function close(){ document.removeEventListener("keydown",onKey); ov.remove(); document.body.style.overflow=prevOverflow; if(restoreEl) restoreEl.focus(); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown",onKey);
  ov.onclick=function(e){ if(e.target===ov||e.target.classList.contains("ov-in")) close(); };
  document.getElementById("ovx").onclick=close;
  bindFlip(document.getElementById("flip"));
  if(link){
    var sn=document.getElementById("ovn"), tt=document.getElementById("ovt"), tm=null;
    if(!tt){ tt=document.createElement("div"); tt.className="toast"; ov.querySelector(".ov-in").appendChild(tt); }
    var toast=function(msg){ tt.textContent=msg; tt.classList.add("show"); clearTimeout(tm); tm=setTimeout(function(){ tt.classList.remove("show"); },2400); };
    var failMsg=function(){
      sn.hidden=false;
      sn.innerHTML='자동 복사가 막혀 있어요. 아래 링크를 직접 복사해 주세요.<textarea class="fb-text" readonly></textarea>';
      var ta=sn.querySelector("textarea"); ta.value=link; ta.focus(); ta.select();
    };
    var doCopy=function(){
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(link).then(function(){ sn.hidden=true; toast("링크가 복사되었어요. 당신의 V를 공유해보세요"); },failMsg);
        } else failMsg();
      }catch(e){ failMsg(); }
    };
    document.getElementById("ovl").onclick=doCopy;
    doCopy();
  } else { document.getElementById("ovx").focus(); }
}

/* ───────── 로딩 → 카드 공개 → 결과 ───────── */
var LOAD_MSGS=["결과를 정리하는 중이에요","나의 메인·서브 컬러를 찾고 있어요","나만의 카드를 준비하고 있어요"];
var LOAD_MS=4200;
var ldTimer=null;
function renderLoading(){
  var dots='<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>';
  app.innerHTML='<section class="screen load"><div class="ld"><div class="ring" aria-hidden="true"></div>'+
    '<div class="lmw" aria-live="polite">'+LOAD_MSGS.map(function(t,i){ return '<p class="lm'+(i===0?' on':'')+'"><span class="t">'+t+dots+'</span></p>'; }).join("")+'</div></div></section>';
  var items=app.querySelectorAll(".lm"), k=0, step=LOAD_MS/LOAD_MSGS.length;
  clearInterval(ldTimer);
  ldTimer=setInterval(function(){
    items[k].classList.remove("on");
    k=(k+1)%items.length;
    items[k].classList.add("on");
  },step);
}
/* ───────── 결과를 구글 시트로 보내기 (설정이 있을 때만, 실패해도 화면 흐름에는 영향 없음) ───────── */
function submitResult(res){
  var ep=CONFIG.sheetEndpoint; if(!ep) return;
  try{
    var m=res.rows[0].t, sb=res.rows[1].t;
    // 시트에는 꼭 필요한 항목만 보냅니다 (제출ID, 이름, 메인/서브 유형과 컬러)
    var payload={ id:state.sessionId, name:state.name, main:m.k, mainColor:m.c, sub:sb.k, subColor:sb.c };
    fetch(ep,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true}).catch(function(){});
  }catch(e){}
}
function startLoading(){
  state.screen="loading"; state.shot=undefined; window.scrollTo(0,0); renderLoading();
  var res=compute(), m=res.rows[0].t, sb=res.rows[1].t;
  submitResult(res);
  var img=makeCard(m,sb,state.name).then(function(u){return u;},function(){return null;});
  var wait=new Promise(function(r){ setTimeout(r,LOAD_MS); });
  Promise.all([img,wait]).then(function(v){
    clearInterval(ldTimer);
    if(state.screen!=="loading") return;
    state.shot=v[0];
    // 로딩 화면은 서서히 사라지고, 같은 순간 카드 화면이 서서히 겹쳐 올라옵니다. 결과 화면은 그 뒤에서 조용히 교체됩니다.
    var ld=app.querySelector(".ld"); if(ld){ ld.style.transition="opacity .5s ease"; ld.style.opacity="0"; }
    showCard(m,sb,state.shot,"결과 보기",null,true);
    setTimeout(function(){ state.screen="result"; render(); window.scrollTo(0,0); },700);
  });
}

function renderResult(){
  var res=compute();
  // 항상 상위 2개만 표시 (동점은 위 정렬 규칙으로 정리, 화면에는 '공동 순위' 표기 없음)
  var cands=[res.rows[0],res.rows[1]];
  var primary=typeCard(cands[0],"MAIN · 대표 유형",true);
  var secondary=typeCard(cands[1],"SUB · 보조 유형",false);
  var m=cands[0].t, sb=cands[1].t, acc=m.white?"var(--fg)":m.hex;
  var headline=esc(state.name)+"님의 V는 "+cands[0].t.k+"에 가까워요";

  var explain = QS.map(function(q,i){
    var o=q.o[state.answers[i]], t=T[o.v];
    return '<article class="ex"><p class="qn">Q'+(i+1)+'</p><p class="qq">'+q.q+'</p><dl>'+
      '<dt>선택한 답변</dt><dd>'+o.t+'</dd>'+
      '<dt>연결 유형</dt><dd><span class="vt'+(t.white?' w':'')+'" style="--c:'+t.hex+'">'+t.k+' · '+t.c+'</span></dd>'+
      '<dt>풀이</dt><dd>'+o.why+'</dd></dl></article>';
  }).join("");

  var scale=function(id,q,l,r){
    return '<div class="fq" data-fq="'+id+'"><p>'+q+'</p><div class="scale" role="group" aria-label="'+q+'">'+[1,2,3,4,5].map(function(n){return '<button data-v="'+n+'" aria-pressed="false">'+n+'</button>';}).join("")+'</div><div class="ends"><span>'+l+'</span><span>'+r+'</span></div></div>';
  };

  var dbgRows=TYPES.map(function(t){
    var r=res.rows.filter(function(x){return x.t===t;})[0];
    var g=res.groups.filter(function(x){return x.rows.indexOf(r)>=0;})[0];
    return '<tr><td><span class="vt'+(t.white?' w':'')+'" style="--c:'+t.hex+'">'+t.k+'</span></td><td>'+r.n+'</td><td>'+r.d+'</td><td>'+(r.n/r.d).toFixed(3)+'</td><td>'+rankLabel(g)+'</td></tr>';
  }).join("");
  var code=state.answers.map(function(a,i){return "Q"+(i+1)+LET[a]+"="+QS[i].o[a].v;}).join("  ");

  app.innerHTML=
  '<section class="screen" style="--acc:'+acc+'">'+
   '<p class="eyebrow">RESULT</p><h1 class="r-title">'+headline+'</h1>'+
   (CONFIG.showExplanationTab?'<div class="tabs" role="tablist"><button role="tab" id="tab-r" aria-selected="true">유형 결과</button><button role="tab" id="tab-e" aria-selected="false">문항별 풀이</button></div>':'<div style="height:18px"></div>')+
   '<div id="pane-r">'+
     primary+secondary+
     '<div class="share"><button class="btn primary block" id="share">공유하기</button></div>'+
   '</div>'+
   (CONFIG.showExplanationTab?'<div id="pane-e" hidden><p class="sec-p" style="margin-top:0">각 답변이 어떤 V 유형과 연결되는지 정리했어요. 어떤 답변도 더 옳거나 뛰어난 것은 아닙니다.</p>'+explain+'</div>':'')+
   '<div style="margin-top:44px"><button class="btn block" id="retry">테스트 다시 하기</button></div>'+
   (CONFIG.showDebug?'<details class="dbg"><summary>TF 디버그 · 유형별 점수</summary><div class="tw"><table><thead><tr><th>유형</th><th>선택</th><th>등장</th><th>점수</th><th>순위</th></tr></thead><tbody>'+dbgRows+'</tbody></table></div><p class="code">'+code+'</p><p class="code">화면 표시는 점수 → 선택 횟수 → 먼저 고른 순으로 상위 2개를 정합니다.</p></details>':'')+
  '</section>';

  // 탭
  if(CONFIG.showExplanationTab){
    var tr=document.getElementById("tab-r"), te=document.getElementById("tab-e");
    function tab(e){ tr.setAttribute("aria-selected",String(!e)); te.setAttribute("aria-selected",String(e)); document.getElementById("pane-r").hidden=e; document.getElementById("pane-e").hidden=!e; }
    tr.onclick=function(){tab(false);}; te.onclick=function(){tab(true);};
  }
  var sh=document.getElementById("share");
  sh.onclick=function(){ showCard(m,sb,state.shot,"닫기",sh,false,baseUrl()+"#"+shareHash(m,sb,state.name)); };
  document.getElementById("retry").onclick=function(){ state.idx=0; state.answers=[]; state.final=null; state.shot=undefined; go("intro"); };
}

function openShared(){
  var sp=parseShare(); if(!sp) return false;
  shareInfo=sp; state.name=sp.name; state.screen="shared"; return true;
}
openShared();
// 같은 탭에서 공유 링크의 주소 뒤(#...)만 바뀌어 들어온 경우에도 공유 화면으로 이동
window.addEventListener("hashchange",function(){
  if(openShared()){ var o=document.querySelector(".ov"); if(o){ o.remove(); document.body.style.overflow=""; } render(); window.scrollTo(0,0); }
});
render();
})();
</script>
